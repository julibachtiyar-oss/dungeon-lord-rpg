<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07090e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dungeon Lord" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Fantasy & Medieval Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <title>Dungeon Lord: RPG & Sanctuary</title>
  </head>
  <body class="bg-[#07090e] text-slate-100 select-none touch-manipulation overflow-hidden overscroll-none">
    <div id="root">
      <!-- Loading skeleton so screen is never pure black -->
      <div style="display:flex;height:100vh;width:100vw;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#07090e;color:#eab308;font-family:sans-serif;">
        <div style="width:40px;height:40px;border:3px solid #eab308;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;"></div>
        <div style="font-weight:bold;font-size:14px;letter-spacing:1px;">MEMUAT DUNGEON LORD...</div>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>

    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Global error reporting for mobile debugging
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && (!root.children || root.children.length === 1)) {
          console.error("Window Error:", e);
        }
      });

      // Register Service Worker for offline PWA functionality
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch(err => {
            console.log('SW registration error:', err);
          });
        });
      }
    </script>
  </body>
</html>
